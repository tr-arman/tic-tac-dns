services:
  dns-ttt:
    build: .
    ports:
      - "53535:53535/udp"
      - "53535:53535/tcp"
    volumes:
      - dns_ttt_data:/data
    command: ["python", "server.py", "--zone", "game.local", "--host", "0.0.0.0", "--port", "53535", "--db", "/data/dns_ttt.sqlite3", "--quiet"]
volumes:
  dns_ttt_data:
